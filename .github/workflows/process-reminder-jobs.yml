name: Process Reminder Jobs

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  process-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Trigger reminder job processor
        env:
          REMINDER_PROCESS_URL: ${{ secrets.REMINDER_PROCESS_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_PROCESS_URL" ]; then
            echo "Missing REMINDER_PROCESS_URL secret"
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "Missing CRON_SECRET secret"
            exit 1
          fi

          curl --fail --show-error --silent \
            --request GET \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$REMINDER_PROCESS_URL"
